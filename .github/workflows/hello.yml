name: Hello GitHub Actions

# 1. When should this workflow run?
on: [push]

# 2. What jobs does it have?
jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your code (typical first step)
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 2: Run a simple shell command
      - name: Say hello
        run: echo "Hello from GitHub Actions!"
